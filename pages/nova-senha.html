<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b3a9a">
  <title>PreçoBit - Nova senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="pagina-login">

  <!-- Formas 3D flutuando no fundo (só decoração) -->
  <div class="cena" aria-hidden="true">
    <div class="painel-fundo"></div>
    <img class="forma forma-anel" src="../img/formas/anel.svg" alt="">
    <img class="forma forma-zigue" src="../img/formas/zigue.svg" alt="">
    <img class="forma forma-espiral" src="../img/formas/espiral.svg" alt="">
    <img class="forma forma-laco" src="../img/formas/laco.svg" alt="">
    <img class="forma forma-onda" src="../img/formas/onda.svg" alt="">
    <img class="forma forma-onda-grossa" src="../img/formas/onda-grossa.svg" alt="">
    <img class="forma forma-placa" src="../img/placa-mae-3d.svg" alt="">
  </div>

  <main class="cartao-login">
    <div class="marca marca-login">
      <span class="marca-icone"></span>
      PREÇOBIT
    </div>

    <h1>Nova senha</h1>

    <form id="form-nova-senha" class="form-cartao" novalidate>
      <div class="campo">
        <label for="senha">Nova senha</label>
        <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
      </div>

      <div class="campo">
        <label for="confirmar">Confirmar senha</label>
        <input type="password" id="confirmar" placeholder="Digite de novo" autocomplete="new-password">
      </div>

      <p id="mensagem" class="erro" role="alert"></p>

      <button type="submit" id="botao-salvar" class="botao-entrar">Salvar senha</button>
    </form>

    <p class="rodape-login">Lembrou a senha? <a href="../index.html">Voltar para o login</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script>
    // O link do e-mail traz um código; o Supabase usa ele para abrir uma sessão temporária
    const form = document.getElementById("form-nova-senha");
    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("botao-salvar");

    function mostrar(texto, sucesso) {
      mensagem.textContent = texto;
      mensagem.className = sucesso ? "erro sucesso" : "erro";
    }

    if (!SUPABASE_CONFIGURADO) mostrar("Configure o Supabase em js/supabase-config.js.");

    form.addEventListener("submit", async function (evento) {
      evento.preventDefault();
      const senha = document.getElementById("senha").value;
      const confirmar = document.getElementById("confirmar").value;

      if (senha.length < 6) return mostrar("A senha precisa ter pelo menos 6 caracteres.");
      if (senha !== confirmar) return mostrar("As senhas não são iguais.");

      const { data } = await supabaseClient.auth.getSession();
      if (!data.session) return mostrar("Link inválido ou expirado. Peça um novo na tela de login.");

      botao.disabled = true;
      const { error } = await supabaseClient.auth.updateUser({ password: senha });
      botao.disabled = false;

      if (error) return mostrar(error.message);

      mostrar("Senha alterada! Indo para a página inicial...", true);
      setTimeout(() => (window.location.href = "home.html"), 1500);
    });
  </script>
</body>
</html>
