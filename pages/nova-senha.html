<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b2a6f">
  <title>PreçoBit - Nova senha</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/tema.js"></script>
</head>
<body class="pagina-home pagina-acesso">

  <div class="fundo-cores">
    <span></span><span></span><span></span>
  </div>

  <header class="topo vidro">
    <div class="topo-esquerda">
      <a href="home.html" class="marca marca-link">
        <span class="marca-icone"></span>
        PREÇOBIT
      </a>
    </div>
    <div class="topo-direita">
      <button type="button" class="botao-sair botao-tema" aria-pressed="false" title="Ligar o modo gamer"><span>🎮</span></button>
      <a href="home.html" class="botao-sair">← Ver preços</a>
    </div>
  </header>

  <main class="acesso acesso-simples">
    <section class="painel-acesso vidro" aria-labelledby="titulo-nova-senha">
      <h1 id="titulo-nova-senha">Nova senha</h1>
      <p class="painel-sub">Escolha uma senha nova para a sua conta.</p>

      <form id="form-nova-senha" class="form-cartao" novalidate>
        <div class="campo">
          <label for="senha">Nova senha</label>
          <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
        </div>

        <div class="campo">
          <label for="confirmar">Confirmar senha</label>
          <input type="password" id="confirmar" placeholder="Digite de novo" autocomplete="new-password">
        </div>

        <p id="mensagem" class="erro" role="alert"></p>

        <button type="submit" id="botao-salvar" class="botao-entrar">Salvar senha</button>
      </form>

      <p class="rodape-login">Lembrou a senha? <a href="entrar.html">Voltar para o login</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script>
    // O link do e-mail traz um código; o Supabase usa ele para abrir uma sessão temporária
    const form = document.getElementById("form-nova-senha");
    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("botao-salvar");

    function mostrar(texto, sucesso) {
      mensagem.textContent = texto;
      mensagem.className = sucesso ? "erro sucesso" : "erro";
    }

    if (!SUPABASE_CONFIGURADO) mostrar("Configure o Supabase em js/supabase-config.js.");

    form.addEventListener("submit", async function (evento) {
      evento.preventDefault();
      const senha = document.getElementById("senha").value;
      const confirmar = document.getElementById("confirmar").value;

      if (senha.length < 6) return mostrar("A senha precisa ter pelo menos 6 caracteres.");
      if (senha !== confirmar) return mostrar("As senhas não são iguais.");

      const { data } = await supabaseClient.auth.getSession();
      if (!data.session) return mostrar("Link inválido ou expirado. Peça um novo na tela de login.");

      botao.disabled = true;
      const { error } = await supabaseClient.auth.updateUser({ password: senha });
      botao.disabled = false;

      if (error) return mostrar(error.message);

      mostrar("Senha alterada! Indo para a página inicial...", true);
      setTimeout(() => (window.location.href = "home.html"), 1500);
    });
  </script>
</body>
</html>
